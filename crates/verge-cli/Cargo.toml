[package]
name = "verge-cli"
description = "Command-line interface for the Verge versioned database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "verge"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# KENAPA: `version` wajib ada selain `path`. Tanpa itu `cargo package`
#         dan `cargo publish` gagal dengan "all dependencies must have a
#         version specified when packaging". Nilai harus sama dengan
#         versi crate yang sedang dirilis.
verge-core = { version = "0.3.0", path = "../verge-core" }
