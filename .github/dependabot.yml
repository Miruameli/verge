# Dependabot menjaga dependensi dan action tetap mutakhir.
#
# KENAPA: kerentanan sering muncul lewat dependensi transitif, bukan kode kita.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
