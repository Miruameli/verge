# Manual publish to crates.io.
#
# WHY: crates.io publishing is permanent. A published version can never be
#      overwritten and the code can never be deleted, so every release is an
#      explicit human decision rather than something a tag or a push can
#      trigger on its own.
#
# ORDER: publish `verge-core` before `verge-cli` for the same version. The CLI
#       depends on the core library by version, and cargo cannot package the
#       CLI until the core version it requires already exists on the registry.
#       Publishing the CLI first fails with "no matching package named
#       `verge-core` found".
name: publish-crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish (publish verge-core first)"
        required: true
        type: choice
        options:
          - verge-core
          - verge-cli
      version:
        description: "Version to publish, for example 0.3.0"
        required: true
        type: string
      ref:
        description: >-
          Git ref whose code will be published, for example v0.1.0.
          Deliberately required with no default: an irreversible upload must
          name its source explicitly. GitHub does not allow an input default
          to reference another input, so there is no safe default to give.
        required: true
        type: string

# Least privilege: the job only needs to read the repository. crates.io
# publishing authenticates with the registry token, not with GitHub write
# access.
permissions:
  contents: read

concurrency:
  # One publish at a time. Two overlapping publishes of the same crate would
  # race on the registry index and one would fail.
  group: publish-crate-${{ inputs.crate }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ inputs.crate }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      # KENAPA: `ref` wajib diisi. Tanpa itu checkout mengambil ref yang
      #         dipakai untuk dispatch (biasanya `main`), sehingga permintaan
      #         publish 0.3.0 akan mengunggah isi `main` berlabel 0.3.0 --
      #         dan versi crates.io tidak bisa pernah diperbaiki.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # KENAPA: nilai toolchain di sini wajib sama dengan `channel` di
      #         rust-toolchain.toml (1.82); ini duplikasi yang disengaja
      #         karena action CI memerlukan input eksplisit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82"

      - name: Verify the manifest version matches the requested version
        # WHY: publishing a version number that does not exist in the manifest
        #      would either fail confusingly or, worse, upload a tarball whose
        #      contents disagree with the version users pin. Refuse instead.
        run: |
          set -euo pipefail
          actual=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='${{ inputs.crate }}'))")
          echo "requested : ${{ inputs.version }}"
          echo "manifest  : ${actual}"
          if [ "${actual}" != "${{ inputs.version }}" ]; then
            echo "::error::manifest version ${actual} does not match the requested ${{ inputs.version }}"
            exit 1
          fi

      - name: Show what is about to be published
        # WHY: publish tidak bisa dibatalkan, jadi ref dan isi yang akan
        #      diunggah harus terlihat di log sebelum terjadi, bukan
        #      diasumsikan dari nama versinya.
        run: |
          set -euo pipefail
          echo "crate     : ${{ inputs.crate }}"
          echo "version   : ${{ inputs.version }}"
          echo "ref       : ${{ inputs.ref }}"
          echo "commit    : $(git rev-parse HEAD)"
          echo "subject   : $(git log -1 --format=%s)"
          echo "tree hash : $(git rev-parse HEAD^{tree})"

      - name: Run the full gate before publishing
        # WHY: a permanent upload must not be the first time a problem is
        #      discovered. The same gates as pull requests run first.
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all --locked

      - name: Run the structure gate when it exists at this ref
        # WHY: `check-structure.py` hanya ada sejak setelah ketiga tag historis
        #      dibuat. Menjalankannya tanpa syarat membuat publish dari tag
        #      selalu gagal, padahal isi tag sudah tidak bisa diaudit dengan
        #      gate yang belum ada saat tag itu dibuat. Lewati dengan
        #      pemberitahuan eksplisit supaya tidak ada yang mengira
        #      semua gate berjalan.
        run: |
          set -euo pipefail
          if [ -f .github/scripts/structure/check-structure.py ]; then
            python3 .github/scripts/structure/check-structure.py
          else
            echo "::warning::structure gate absent at ${{ inputs.ref }} (added after the historical tags); fmt, clippy and tests ran"
          fi

      - name: Publish to crates.io
        run: cargo publish -p ${{ inputs.crate }} --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}