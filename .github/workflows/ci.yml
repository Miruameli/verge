# Quality gate Verge.
#
# KENAPA: setiap PR melewati gate yang sama seperti di lokal, sehingga
#         "hijau di laptop" bukan bukti.
# CATATAN: nilai `toolchain` di bawah wajib sama dengan `channel` di
#         `rust-toolchain.toml` (1.98); ini satu-satunya duplikasi yang
#         disengaja karena action CI memerlukan input eksplisit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt
      - run: cargo fmt --all --check

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # KENAPA: aturan modularisasi dan kelengkapan header tidak terlihat
      #         dari cargo; damage header pada PR #35 lolos dari seluruh gate.
      - name: Gate struktur repository
        run: python3 .github/scripts/structure/check-structure.py

  versions:
    name: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # KENAPA: literal `version` untuk `verge-core` di `verge-cli/Cargo.toml`
        #         tidak memakai `workspace = true`; bump workspace yang lupa
        #         literal itu menerbitkan CLI menaut core lama, dan publish
        #         tidak bisa dibatalkan.
      - name: Cek literal versi CLI sama dengan workspace
        run: python3 .github/scripts/check-versions.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - run: cargo test --all --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # KENAPA: cargo-audit versi terbaru membutuhkan rustc yang lebih baru dari
      #         MSRV proyek, jadi toolchain proyek dikoverride hanya untuk job ini.
      - name: Audit dependency RustSec
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTUP_TOOLCHAIN: stable

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Deteksi secret dengan gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
