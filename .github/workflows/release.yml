# Workflow rilis Verge.
#
# KENAPA: kebijakan rilis melarang rilis tanpa binary lintas platform, checksum
#         SHA256, dan SBOM; tag tanpa artefak tidak boleh lahir.
# CATATAN: `toolchain` di bawah wajib sama dengan `channel` di
#         `rust-toolchain.toml` (1.98) agar binary yang terbit sama dengan
#         yang diverifikasi quality gate.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            linker: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            linker: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            linker: ""
    steps:
      - uses: actions/checkout@v7
      - name: Pasang linker silang untuk aarch64 Linux
        # KENAPA: runner ubuntu hanya punya toolchain x86_64; binary aarch64
        #         memerlukan linker target sebelum cargo build bisa linking.
        #         Tanpa env linker, cargo memakai /usr/bin/ld host dan gagal
        #         dengan "file in wrong format".
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ github.sha }}
      - name: Bangun binary rilis
        # KENAPA: env linker harus ada pada langkah build, bukan hanya pada
        #         langkah pemasangan paket; tanpa ini cargo memakai ld host.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Kemas artefak
        shell: bash
        run: .github/scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.archive }}"
      - name: SBOM sikliklus komponen
        # KENAPA: SBOM dibuat dari `cargo metadata` dengan path keluaran yang
        #         pasti; `cargo cyclonedx` menulis ke lokasi berbeda-beda antar
        #         versi sehingga sempat hilang dari rilis. Shell dipaksa bash
        #         agar utilitas GNU berperilaku sama di semua runner.
        shell: bash
        run: .github/scripts/package-sbom.sh "${{ matrix.target }}" dist
      - name: Periksa isi folder distributable
        shell: bash
        # KENAPA: upload-artifact v4 mempertahankan path relatif terhadap akar
        #         repo; seluruh file sudah dikumpulkan di dist/ agar checksum
        #         dan rilis terbit tanpa folder tambahan.
        run: ls -1 dist
      - uses: actions/upload-artifact@v4
        with:
          name: verge-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  checksums:
    name: checksum dan sbom gabungan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Hitung SHA256 seluruh artefak
        # KENAPA: checksum hanya boleh mencakup file yang benar-benar terbit.
        run: |
          cd dist
          ls -1
          # SHA256SUMS dikecualikan agar tidak meng-hash dirinya sendiri.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Unggah bundle rilis
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist
          if-no-files-found: error

  publish:
    name: terbitkan rilis
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Pastikan setiap artefak punya checksum
        # KENAPA: rilis tanpa checksum ditolak oleh kebijakan; gagal di sini
        #         lebih baik daripada menerbitkan rilis yang tidak terverifikasi.
        run: |
          cd dist
          while read -r sum file; do
            echo "$sum  $file" | sha256sum --check --strict -
          done < SHA256SUMS
      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
